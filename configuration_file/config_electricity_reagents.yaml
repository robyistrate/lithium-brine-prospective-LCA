# ###################
# PRODUCTION PATHWAYS
# ###################
production pathways:
  # === Electricity ===
  Bioenergy:
    ecoinvent alias:
      name: heat and power co-generation, wood chips, 6667 kW
      reference product: electricity, high voltage
      exists in original database: true
      new dataset: false
      regionalize: false
    production volume:
      variable: Production|Electricity|Bioenergy

  Coal:
    ecoinvent alias:
      name: electricity production, hard coal
      reference product: electricity, high voltage
      exists in original database: true
      new dataset: false
      regionalize: false
    production volume:
      variable: Production|Electricity|Coal

  Hydro reservoir alpine:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, hydro, reservoir, alpine region
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Hydro reservoir alpine

  Hydro reservoir non-alpine:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, hydro, reservoir, non-alpine region
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Hydro reservoir non-alpine

  Hydro reservoir tropical:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, hydro, reservoir, tropical region
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Hydro reservoir tropical

  Hydro run-of-river:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, hydro, run-of-river
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Hydro run-of-river

  Hydro storage:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, hydro, pumped storage
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Hydro storage

  Natural gas combined cycle:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, natural gas, combined cycle power plant
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Natural gas combined cycle

  Natural gas conventional:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, natural gas, conventional power plant
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Natural gas conventional

  Nuclear PWR:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, nuclear, pressure water reactor, heavy water moderated
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Nuclear PWR

  Solar PV:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, photovoltaic, 570kWp open ground installation,
        multi-Si
      new dataset: false
      reference product: electricity, low voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Solar PV

  Wind onshore:
    ecoinvent alias:
      exists in original database: true
      name: electricity production, wind, 1-3MW turbine, onshore
      new dataset: false
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Wind onshore

  Low to medium:
    ecoinvent alias:
      exists in original database: false
      name: market for electricity, medium voltage, IEA
      new dataset: true
      reference product: electricity, medium voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Low to medium

  Medium to high:
    ecoinvent alias:
      exists in original database: false
      name: market for electricity, high voltage, IEA
      new dataset: true
      reference product: electricity, high voltage
      regionalize: false
    production volume:
      variable: Production|Electricity|Medium to high

  # === Reagents ===

  quicklime_calcination:
    ecoinvent alias:
      name: quicklime production, PFRK, milled, loose
      reference product: quicklime, milled, loose
      exists in original database: false
      new dataset: true
      regionalize: false
    production volume:
      variable: Production|Quicklime|PFRK
    efficiency:
    - variable: Efficiency|Quicklime|PFRK|Limestone
      reference year: 2020
      includes:
        technosphere:
          - limestone, crushed, washed
    - variable: Efficiency|Quicklime|PFRK|Coal heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, at hard coal industrial furnace 1-10MW
    - variable: Efficiency|Quicklime|PFRK|Natural gas heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, natural gas, at industrial furnace >100kW
    - variable: Efficiency|Quicklime|PFRK|Waste heat
      reference year: 2020
      includes:
        technosphere:
          - heat, from municipal waste incineration to generic market for heat district or industrial, other than natural gas 
    - variable: Efficiency|Quicklime|PFRK|Oil heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, heavy fuel oil, at industrial furnace 1MW           
    - variable: Efficiency|Quicklime|PFRK|Biomass heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, wood chips from industry, at furnace 1000kW, state-of-the-art 2014
    - variable: Efficiency|Quicklime|PFRK|Electricity
      reference year: 2020
      includes:
        technosphere:
          - electricity, medium voltage
          - electricity, high voltage
          - electricity, low voltage  
    - variable: Efficiency|Quicklime|PFRK|Waste inert
      reference year: 2020
      includes:
        technosphere:
          - inert waste, for final disposal

  quicklime_calcination_w_CCS:
    ecoinvent alias:
      name: quicklime production, PFRK with carbon capture and storage, milled, loose
      reference product: quicklime, milled, loose
      exists in original database: false
      new dataset: true
      regionalize: false
    production volume:
      variable: Production|Quicklime|PFRK with CCS
    efficiency:
    - variable: Efficiency|Quicklime|PFRK with CCS|Limestone
      reference year: 2020
      includes:
        technosphere:
          - limestone, crushed, washed
    - variable: Efficiency|Quicklime|PFRK with CCS|Coal heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, at hard coal industrial furnace 1-10MW
    - variable: Efficiency|Quicklime|PFRK with CCS|Natural gas heat
      reference year: 2020
      includes:
        technosphere:
