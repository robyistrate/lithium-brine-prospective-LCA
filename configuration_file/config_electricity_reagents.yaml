          - electricity, medium voltage
          - electricity, high voltage
          - electricity, low voltage  
    - variable: Efficiency|Quicklime|PFRK with CCS|Waste inert
      reference year: 2020
      includes:
        technosphere:
          - inert waste, for final disposal

  soda_ash_Solvay:
    ecoinvent alias:
      name: soda ash production, Solvay process
      reference product: soda ash, light
      exists in original database: false
