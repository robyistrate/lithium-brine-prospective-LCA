    - variable: Efficiency|Soda ash|Solvay process|Water cooling
      reference year: 2020
      includes:
        biosphere:
          - Water, cooling, unspecified natural origin
  #  - variable: Efficiency|Soda ash|Solvay process|Water discharge
  #    reference year: 2020
  #    includes:
  #      biosphere:
  #        - Water
  #    excludes:
  #        biosphere:
  #            - Water, cooling, unspecified natural origin
  #            - Water, unspecified natural origin
    - variable: Efficiency|Soda ash|Solvay process|Water evaporation
      reference year: 2020
      includes:
