# ###################
# MARKETS
# ###################
markets:
- name: market for electricity, high voltage, IEA
  reference product: electricity, high voltage
  unit: kilowatt hour
  includes:
  - Hydro reservoir tropical
  - Natural gas conventional
  - Hydro storage
  - Wind onshore
  - Hydro reservoir alpine
  - Hydro reservoir non-alpine
  - Solar PV
  - Hydro run-of-river
  - Coal
  - Nuclear PWR
  - Natural gas combined cycle
  - Bioenergy
  replaces:
  - location: CL
    name: market for electricity, high voltage
    product: electricity, high voltage
  - location: AR
    name: market for electricity, high voltage
    product: electricity, high voltage
  except regions:
  - World

- name: market for electricity, medium voltage, IEA
  reference product: electricity, medium voltage
  unit: kilowatt hour
  includes:
  - Medium to high
  replaces:
  - location: CL
    name: market for electricity, medium voltage
    product: electricity, medium voltage
  - location: AR
    name: market for electricity, medium voltage
    product: electricity, medium voltage
  except regions:
  - World

- name: market for electricity, low voltage, IEA
  reference product: electricity, low voltage
  unit: kilowatt hour
  includes:
  - Low to medium
  replaces:
  - location: CL
    name: market for electricity, low voltage
    product: electricity, low voltage
  - location: AR
    name: market for electricity, low voltage
    product: electricity, low voltage
  except regions:
  - World

- name: market for quicklime, milled, packed (prospective)
  reference product: quicklime, milled, packed
  unit: kilogram
  includes:
    - quicklime_calcination
    - quicklime_calcination_w_CCS
  add:
    - name: market for packing, lime product
      reference product: packing, lime product
      amount: 1.0
  replaces:
    - name: market for quicklime, milled, packed
      product: quicklime, milled, packed

- name: market for soda ash, light (prospective)
  reference product: soda ash, light
  unit: kilogram
  includes:
    - soda_ash_Solvay
    - soda_ash_Solvay_w_CCS
    - soda_ash_trona
  replaces:
    - name: market for soda ash, light
      product: soda ash, light

- name: market for sodium hydroxide, without water, in 50% solution state (prospective)
  reference product: sodium hydroxide, without water, in 50% solution state
  unit: kilogram
  includes:
    - sodium_hydroxide_membrane_cell
    - sodium_hydroxide_diaphragm_cell
    - sodium_hydroxide_mercury_cell
  add:
    - name: market for transport, freight train
      reference product: transport, freight train
      amount: 0.309
    - name: market for transport, freight, lorry, unspecified
      reference product: transport, freight, lorry, unspecified
      amount: 0.2088
    - name: market for transport, freight, sea, container ship
      reference product: transport, freight, sea, container ship
      amount: 0.599
    - name: market for transport, freight, inland waterways, barge
      reference product: transport, freight, inland waterways, barge
      amount: 0.0246
  replaces:
    - name: market for sodium hydroxide, without water, in 50% solution state
      product: sodium hydroxide, without water, in 50% solution state

- name: market for chlorine, gaseous (prospective)
  reference product: chlorine, gaseous
  unit: kilogram
  includes:
    - chlorine_membrane_cell
    - chlorine_diaphragm_cell
    - chlorine_mercury_cell
  replaces:
    - name: market for chlorine, gaseous
      product: chlorine, gaseous