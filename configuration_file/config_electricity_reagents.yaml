          - electricity, low voltage       
    - variable: Efficiency|Soda ash|Solvay process|Waste inert
      reference year: 2020
      includes:
        technosphere:
          - inert waste, for final disposal
    - variable: Efficiency|Soda ash|Solvay process|Water withdrawal
      reference year: 2020
      includes:
        biosphere:
