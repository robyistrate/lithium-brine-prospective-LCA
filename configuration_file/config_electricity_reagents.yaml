    - variable: Efficiency|Soda ash|Solvay process|Sodium chloride
      reference year: 2020
      includes:
        technosphere:
          - sodium chloride, brine solution
    - variable: Efficiency|Soda ash|Solvay process|Ammonia makeup
      reference year: 2020
      includes:
        technosphere:
          - ammonia, anhydrous, liquid
    - variable: Efficiency|Soda ash|Solvay process|Coke
      reference year: 2020
      includes:
        technosphere:
          - coke
    - variable: Efficiency|Soda ash|Solvay process|Coal heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, at hard coal industrial furnace 1-10MW
    - variable: Efficiency|Soda ash|Solvay process|Natural gas heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, natural gas, at industrial furnace >100kW
    - variable: Efficiency|Soda ash|Solvay process|Biomass heat
      reference year: 2020
      includes:
        technosphere:
          - heat production, wood chips from industry, at furnace 1000kW, state-of-the-art 2014
    - variable: Efficiency|Soda ash|Solvay process|Electricity
      reference year: 2020
      includes:
        technosphere:
